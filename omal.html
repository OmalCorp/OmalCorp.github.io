<title>omal dev build - download</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1d1f24;
    --muted: #6b7079;
    --accent: #d9302c;
    --bar: #e3e5e9;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #15161a;
      --card: #1f2127;
      --text: #f1f2f4;
      --muted: #9aa0aa;
      --bar: #2c2f37;
      color-scheme: dark;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
  }
  .card {
    width: 100%;
    max-width: 440px;
    background: var(--card);
    border-radius: 14px;
    padding: 28px;
    box-shadow: 0 6px 24px rgba(0,0,0,0.12);
  }
  .logo {
    width: 64px; height: 64px;
    border-radius: 12px;
    display: block;
    margin-bottom: 16px;
  }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 14px; margin: 0 0 22px; }
  .file {
    display: flex; justify-content: space-between;
    font-size: 14px; margin-bottom: 8px;
  }
  .track {
    height: 10px; background: var(--bar);
    border-radius: 999px; overflow: hidden;
  }
  .fill {
    height: 100%; width: 0%;
    background: var(--accent);
    transition: width 0.3s linear;
  }
  .meta {
    display: flex; justify-content: space-between;
    font-size: 12px; color: var(--muted); margin-top: 10px;
  }
  .status { margin-top: 18px; font-size: 13px; color: var(--muted); min-height: 1.2em; }
  button {
    margin-top: 18px; width: 100%;
    padding: 12px; border: 0; border-radius: 10px;
    background: var(--accent); color: #fff;
    font-size: 15px; font-weight: 600; cursor: pointer;
  }
  button:disabled { opacity: 0.5; cursor: default; }
</style>

    <div class="meta">
      <span id="pct">0%</span>

    <button id="btn" disabled>Downloading…</button>
  </div>

<script>
  const fill = document.getElementById('fill');
  const pct = document.getElementById('pct');
  const eta = document.getElementById('eta');
  const size = document.getElementById('size');
  const status = document.getElementById('status');
  const btn = document.getElementById('btn');

  const messages = [
    'Starting download…',
    'Connecting to mirror eu-3…',
    'Verifying signature… (skipped)',
    'Resolving dependencies…',
    'Downloading core modules…',
    'Almost there, do not close this tab…',
    'Finalizing…'
  ];

  let progress = 0;
  const total = (Math.random() * 300 + 180).toFixed(1);
  size.textContent = total + ' MB';

  // Scale the fake speed by the user's connection (Network Information API).
  // Falls back to a moderate speed when the browser does not report it.
  const conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
  const downlink = conn && typeof conn.downlink === 'number' ? conn.downlink : 10; // Mbps
  const speedFactor = Math.min(1, Math.max(0.12, downlink / 40));
  const baseStep = 3.2 * speedFactor;
  const minStep = 0.4 * speedFactor;

  const timer = setInterval(() => {
    progress += Math.random() * baseStep + minStep;
    if (progress > 100) progress = 100;

    const p = Math.floor(progress);
    fill.style.width = progress + '%';
    pct.textContent = p + '%';

    const remaining = Math.max(0, Math.round((100 - progress) / (2.4 * speedFactor)));
    eta.textContent = 'ETA ' + String(Math.floor(remaining / 60)).padStart(2, '0') + ':' + String(remaining % 60).padStart(2, '0');

    status.textContent = messages[Math.min(messages.length - 1, Math.floor(progress / 15))];

    if (progress >= 100) {
      clearInterval(timer);
      eta.textContent = 'Done';
      status.textContent = 'Download complete. Verifying checksum… ✓';
      btn.disabled = false;
      btn.textContent = 'Install omal dev build';
      setTimeout(() => {
        window.location.href = 'https://www.youtube.com/watch?v=dQw4w9WgXcQ';
      }, 1800);
    }
  }, 250);
</script>
